services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_data:/data
    expose:
      - "3000"
    stop_grace_period: 45s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  app_data:
  caddy_data:
  caddy_config:
